[project]
name = "female-fabric"
version = "1.0.0"
description = "Интернет-магазин женской одежды Female-Fabric"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "PyJWT>=2.8.0",
    "pillow>=10.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "httpx>=0.27.0",
    "pg8000>=1.30.0"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.api.admin", "app.core", "app.models", "app.schemas"]

[tool.setuptools.package-data]
app = ["static/**/*", "templates/**/*"]
