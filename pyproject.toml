[project]
name = "female-fabric"
version = "1.0.0"
description = "Интернет-магазин женской одежды Female-Fabric на Cloudflare Python Workers"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110.0",
    "pydantic>=2.6.0",
    "sqlalchemy>=2.0.0",
    "PyJWT>=2.8.0",
    "bcrypt>=4.1.0",
    "pillow>=10.2.0",
    "python-multipart>=0.0.9",
    "email-validator>=2.1.0",
    "httpx>=0.27.0"
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0"
]
