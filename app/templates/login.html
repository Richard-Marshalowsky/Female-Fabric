<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход и регистрация — Female-Fabric</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="bg-[#FAF8F5] text-[#1C1917] flex flex-col min-h-screen">

  <header class="site-header sticky top-0 z-40 bg-[#FAF8F5]/90 backdrop-blur border-b border-[#E7E2DA]">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between gap-4">
      <a href="/" class="flex flex-col items-center">
        <span class="font-serif text-2xl md:text-3xl font-semibold tracking-wider uppercase text-neutral-900">Female-Fabric</span>
      </a>
      <a href="/" class="text-xs font-semibold hover:underline">← На главную</a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-12 flex-1 flex items-center justify-center">
    <div class="bg-white p-8 md:p-10 rounded-2xl border border-[#E7E2DA] max-w-md w-full shadow-sm">
      
      <div class="flex border-b border-[#E7E2DA] mb-6">
        <button id="auth-tab-login" class="flex-1 py-3 text-center text-sm font-semibold border-b-2 border-neutral-900 active">Вход</button>
        <button id="auth-tab-register" class="flex-1 py-3 text-center text-sm font-semibold text-neutral-400 border-b-2 border-transparent">Регистрация</button>
      </div>

      <!-- Login Form -->
      <form id="auth-form-login" class="space-y-4">
        <div>
          <label class="block text-xs font-medium text-neutral-700 mb-1">Email</label>
          <input type="email" id="login-email" required class="form-input text-sm" placeholder="anna@example.com">
        </div>
        <div>
          <div class="flex justify-between items-center mb-1">
            <label class="block text-xs font-medium text-neutral-700">Пароль</label>
            <button type="button" onclick="promptForgotPassword()" class="text-xs text-neutral-500 hover:underline">Забыли пароль?</button>
          </div>
          <input type="password" id="login-password" required class="form-input text-sm" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full py-3 font-medium">Войти в аккаунт</button>

        <div class="mt-6 pt-4 border-t border-[#F0EDE8] text-xs text-neutral-500 space-y-1">
          <div><strong>Демо администратор:</strong> admin@female-fabric.ru / Admin123!</div>
          <div><strong>Демо покупатель:</strong> user@female-fabric.ru / User123!</div>
        </div>
      </form>

      <!-- Register Form -->
      <form id="auth-form-register" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-medium text-neutral-700 mb-1">Ваше имя</label>
          <input type="text" id="reg-name" required class="form-input text-sm" placeholder="Анна Иванова">
        </div>
        <div>
          <label class="block text-xs font-medium text-neutral-700 mb-1">Email</label>
          <input type="email" id="reg-email" required class="form-input text-sm" placeholder="anna@example.com">
        </div>
        <div>
          <label class="block text-xs font-medium text-neutral-700 mb-1">Телефон</label>
          <input type="tel" id="reg-phone" class="form-input text-sm" placeholder="+7 (999) 000-00-00">
        </div>
        <div>
          <label class="block text-xs font-medium text-neutral-700 mb-1">Пароль (минимум 6 символов)</label>
          <input type="password" id="reg-password" required minlength="6" class="form-input text-sm" placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary w-full py-3 font-medium">Зарегистрироваться</button>
      </form>

    </div>
  </main>

  <footer class="bg-[#161616] text-[#FAF8F5] py-8 text-center text-xs text-neutral-400 mt-auto">
    © 2026 Female-Fabric. Все права защищены.
  </footer>

  <div id="toast-container"></div>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/components/modal.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/store.js"></script>
  <script src="/static/js/app.js"></script>
  <script>
    window.promptForgotPassword = async () => {
      const email = prompt('Введите ваш email для сброса пароля:');
      if (!email) return;
      try {
        const res = await window.API.forgotPassword(email);
        alert(`${res.message}\n${res.reset_token ? 'Токен для сброса: ' + res.reset_token : ''}`);
      } catch (err) {
        alert(err.message);
      }
    };
  </script>
</body>
</html>
