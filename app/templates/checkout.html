<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оформление заказа — Female-Fabric</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="bg-[#FAF8F5] text-[#1C1917] flex flex-col min-h-screen">

  <header class="site-header sticky top-0 z-40 bg-[#FAF8F5]/90 backdrop-blur border-b border-[#E7E2DA]">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between gap-4">
      <a href="/" class="flex flex-col items-center">
        <span class="font-serif text-2xl md:text-3xl font-semibold tracking-wider uppercase text-neutral-900">Female-Fabric</span>
      </a>
      <a href="/cart" class="text-xs font-semibold hover:underline">← Назад в корзину</a>
    </div>
  </header>

  <main class="container mx-auto px-4 py-10 flex-1 max-w-5xl">
    <h1 class="text-3xl font-serif mb-8">Оформление заказа</h1>

    <form id="checkout-form" class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      
      <!-- Checkout Form Fields -->
      <div class="lg:col-span-2 space-y-6">
        
        <!-- Contact details -->
        <div class="bg-white p-6 rounded-xl border border-[#E7E2DA]">
          <h3 class="font-serif text-xl font-semibold mb-4">1. Контактные данные</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-medium text-neutral-700 mb-1">Имя *</label>
              <input type="text" id="checkout-first-name" required class="form-input text-sm" placeholder="Екатерина">
            </div>
            <div>
              <label class="block text-xs font-medium text-neutral-700 mb-1">Фамилия *</label>
              <input type="text" id="checkout-last-name" required class="form-input text-sm" placeholder="Смирнова">
            </div>
            <div>
              <label class="block text-xs font-medium text-neutral-700 mb-1">Телефон *</label>
              <input type="tel" id="checkout-phone" required class="form-input text-sm" placeholder="+7 (916) 123-45-67">
            </div>
            <div>
              <label class="block text-xs font-medium text-neutral-700 mb-1">Email *</label>
              <input type="email" id="checkout-email" required class="form-input text-sm" placeholder="ekaterina@example.com">
            </div>
          </div>
        </div>

        <!-- Delivery method & address -->
        <div class="bg-white p-6 rounded-xl border border-[#E7E2DA]">
          <h3 class="font-serif text-xl font-semibold mb-4">2. Способ и адрес доставки</h3>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="delivery_method" value="Курьер до двери" checked class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">Курьер с примеркой</div>
                <div class="text-[11px] text-neutral-500">1-2 дня (до двери)</div>
              </div>
            </label>

            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="delivery_method" value="СДЭК / ПВЗ" class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">СДЭК (Пункт выдачи)</div>
                <div class="text-[11px] text-neutral-500">2-4 дня по РФ</div>
              </div>
            </label>

            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="delivery_method" value="Почта России" class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">Почта России</div>
                <div class="text-[11px] text-neutral-500">3-7 дней</div>
              </div>
            </label>

            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="delivery_method" value="Самовывоз" class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">Самовывоз из бутика</div>
                <div class="text-[11px] text-neutral-500">Москва, Кутузовский пр.</div>
              </div>
            </label>
          </div>

          <div class="space-y-4">
            <div>
              <label class="block text-xs font-medium text-neutral-700 mb-1">Город *</label>
              <input type="text" id="checkout-city" required class="form-input text-sm" placeholder="Москва">
            </div>
            <div>
              <label class="block text-xs font-medium text-neutral-700 mb-1">Улица, дом, квартира / ПВЗ *</label>
              <input type="text" id="checkout-address" required class="form-input text-sm" placeholder="ул. Арбат, д. 10, кв. 25">
            </div>
            <div>
              <label class="block text-xs font-medium text-neutral-700 mb-1">Комментарий к заказу (код домофона, удобное время)</label>
              <textarea id="checkout-notes" rows="2" class="form-input text-sm" placeholder="Позвоните за час до прибытия"></textarea>
            </div>
          </div>
        </div>

        <!-- Payment method -->
        <div class="bg-white p-6 rounded-xl border border-[#E7E2DA]">
          <h3 class="font-serif text-xl font-semibold mb-4">3. Способ оплаты</h3>
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="payment_method" value="Картой онлайн" checked class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">Банковской картой онлайн</div>
                <div class="text-[11px] text-neutral-500">Visa, Mastercard, МИР</div>
              </div>
            </label>

            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="payment_method" value="СБП" class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">СБП (Система быстрых платежей)</div>
                <div class="text-[11px] text-neutral-500">QR-код или приложение банка</div>
              </div>
            </label>

            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="payment_method" value="При получении" class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">При получении курьеру</div>
                <div class="text-[11px] text-neutral-500">Картой или наличными после примерки</div>
              </div>
            </label>

            <label class="border border-[#E7E2DA] rounded-lg p-3.5 flex items-center gap-3 cursor-pointer hover:border-neutral-900">
              <input type="radio" name="payment_method" value="Долями" class="text-neutral-900">
              <div>
                <div class="font-semibold text-xs">Долями (4 платежа)</div>
                <div class="text-[11px] text-neutral-500">25% сейчас, без переплат</div>
              </div>
            </label>
          </div>
        </div>

      </div>

      <!-- Right Summary Column -->
      <div>
        <div class="bg-white p-6 rounded-xl border border-[#E7E2DA] sticky top-24">
          <h3 class="font-serif text-xl font-semibold mb-4 pb-3 border-b border-[#E7E2DA]">Ваш заказ</h3>
          
          <div id="checkout-items-summary" class="max-h-64 overflow-y-auto mb-6"></div>

          <div class="space-y-3 text-sm mb-6 border-t border-[#E7E2DA] pt-4">
            <div class="flex justify-between">
              <span class="text-neutral-500">Товары:</span>
              <span id="checkout-subtotal" class="font-medium">0 ₽</span>
            </div>
            <div id="checkout-discount-row" class="hidden flex justify-between text-rose-600">
              <span>Скидка:</span>
              <span id="checkout-discount" class="font-medium">0 ₽</span>
            </div>
            <div class="flex justify-between">
              <span class="text-neutral-500">Доставка:</span>
              <span id="checkout-delivery" class="font-medium">Бесплатно</span>
            </div>
            <div class="border-t border-[#E7E2DA] pt-3 flex justify-between text-lg font-bold">
              <span>Итого:</span>
              <span id="checkout-total">0 ₽</span>
            </div>
          </div>

          <button type="submit" class="btn btn-primary w-full py-4 text-center font-semibold text-sm">
            Подтвердить заказ
          </button>

          <p class="text-[11px] text-neutral-400 text-center mt-3">
            Нажимая кнопку, вы соглашаетесь с условиями оферты и обработки данных
          </p>
        </div>
      </div>

    </form>
  </main>

  <footer class="bg-[#161616] text-[#FAF8F5] py-8 text-center text-xs text-neutral-400 mt-auto">
    © 2026 Female-Fabric. Все права защищены.
  </footer>

  <div id="toast-container"></div>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/components/modal.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/store.js"></script>
  <script src="/static/js/app.js"></script>
  <script src="/static/js/pages/checkout.js"></script>
</body>
</html>
